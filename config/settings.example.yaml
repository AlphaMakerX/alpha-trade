# Alpha Trade 全局配置

# 交易所 API 配置
exchange:
  name: binance
  api_key: ${BINANCE_API_KEY}
  secret: ${BINANCE_SECRET_KEY}
  sandbox: ${USE_TESTNET}  # 是否使用测试网

# 交易对
trading:
  pair: ETH/USDT
  commission: 0.001    # 手续费率 0.1%
  slippage: 0.0005     # 滑点 0.05%

# 数据粒度
data:
  timeframes:
    - 1m
    - 5m
    - 15m
    - 1h
    - 4h
    - 1d

# 回测参数
backtest:
  initial_capital: 10000  # 初始资金 USDT
  start_date: "2024-01-01"
  end_date: "2025-01-01"
  timeframe: 1h  # 回测使用的K线周期

# 数据库
database:
  host: localhost
  port: 5432
  name: alpha_trade
  user: postgres
  password: ${DB_PASSWORD}

# Redis
redis:
  host: localhost
  port: 6379
  db: 0
