[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-trade"
version = "0.1.0"
description = "ETH/USDT quantitative trading system"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
    "ta>=0.11",
    "Backtesting>=0.3",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[project.scripts]
alpha-trade = "main:cli"

[tool.setuptools.packages.find]
include = ["data*", "strategies*", "indicators*", "engine*", "analysis*", "utils*"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
